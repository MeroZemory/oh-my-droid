name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["22.13", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify generated runtime bundles
        run: >-
          node -e 'const {execFileSync}=require("node:child_process");const dirty=execFileSync("git",["status","--porcelain","--","bridge/mcp-server.cjs","bridge/hud.cjs"],{encoding:"utf8"}).trim();if(dirty)throw new Error("Generated runtime bundles are stale:\n"+dirty)'
      - run: npm run lint
      - run: npx vitest run
