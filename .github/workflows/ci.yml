name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.13", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      # Temporary main-branch baseline exclusions are tracked in Issue #14.
      # Remove each exclusion when its underlying failure is fixed.
      - run: >-
          npx vitest run
          --exclude src/__tests__/agent-registry.test.ts
          --exclude src/__tests__/installer.test.ts
          --exclude src/__tests__/skills.test.ts
          --exclude src/__tests__/analytics/tokscale-adapter.test.ts
