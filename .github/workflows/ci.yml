name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede in-flight runs for the same PR: the matrix is 6 jobs, so pushing a
# fixup while an earlier run is still going doubles the cost for a result
# nobody reads. Pushes to main are never cancelled - that history stays intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["22.13", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Verify generated runtime bundles
        run: >-
          node -e 'const {execFileSync}=require("node:child_process");const dirty=execFileSync("git",["status","--porcelain","--","bridge/mcp-server.cjs","bridge/hud.cjs"],{encoding:"utf8"}).trim();if(dirty)throw new Error("Generated runtime bundles are stale:\n"+dirty)'
      - run: npm run lint
      - run: npx vitest run
