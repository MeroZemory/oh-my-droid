name: Manage Stale Issues

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues
        uses: actions/stale@v9
        with:
          # Issue configuration
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity.

            It will be closed in 14 days if no further activity occurs.

            If this is still relevant:
            - Comment to keep it open
            - Add the `pinned` label to prevent auto-closing

            Thank you for contributing to oh-my-droid!

          close-issue-message: |
            This issue has been automatically closed due to inactivity.

            Feel free to reopen if the issue persists. For installation help, try running `/doctor` after installing.

          # Timing (issues only)
          days-before-stale: 30
          days-before-close: 14

          # Pull requests are never marked stale or auto-closed. An open PR is
          # usually waiting on maintainer review, so closing it on a timer
          # penalises the contributor for our latency. Triage them by hand.
          days-before-pr-stale: -1
          days-before-pr-close: -1

          # Labels
          stale-issue-label: stale

          # Exempt labels - issues with these labels won't be marked stale
          exempt-issue-labels: 'pinned,security,bug,enhancement'

          # Limit operations per run
          operations-per-run: 30
